<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>海师大共享单车地图</title>
    <script type="text/javascript">
        window._AMapSecurityConfig = { securityJsCode: '318c9936d7b572f1066670a460e353d6' }
    </script>
    <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=603b020e940a16362a7f5270b0acfe29"></script>
    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
        .custom-marker {
            background: rgba(255, 255, 255, 0.95); border: 2px solid #1890ff;
            border-radius: 8px; padding: 6px 12px; text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); color: #333; white-space: nowrap;
        }
        .custom-marker h4 { margin: 0 0 4px 0; font-size: 14px; color: #555; }
        .custom-marker p { margin: 0; font-size: 16px; font-weight: bold; color: #1890ff; }
    </style>
</head>
<body>
    <div id="container"></div>
    <script>
        var map = new AMap.Map('container', { 
            zoom: 16.5, 
            center: [110.512, 19.984], 
            viewMode: '3D', 
            pitch: 35 
        });
        
        // 【重点】你的坐标已经原封不动地写在这里了！
        // Python 启动时，会自动替换掉这里面的数字，实现动态刷新。
        var stationList = [
            { name: "食堂站点", position: [110.515, 19.985], bikeNum: 45 },
            { name: "教学楼站点", position: [110.510, 19.981], bikeNum: 30 },
            { name: "宿舍站点", position: [110.513, 19.986], bikeNum: 20 }
        ]; 

        stationList.forEach(function(item) {
            var markerContent = `
                <div class="custom-marker">
                    <h4>${item.name}</h4>
                    <p class="bike-num" data-name="${item.name}">${item.bikeNum} 辆</p >
                </div>
            `;
            var marker = new AMap.Marker({
                position: item.position, content: markerContent, offset: new AMap.Pixel(-40, -40), map: map
            });
        });

        // 防闪烁数字跳动逻辑
        setInterval(function() {
            stationList.forEach(function(item) {
                if (typeof item.bikeNum === 'number') {
                    var change = Math.floor(Math.random() * 5) - 2;
                    item.bikeNum = Math.max(0, item.bikeNum + change);
                    var el = document.querySelector('.bike-num[data-name="' + item.name + '"]');
                    if (el) el.innerText = item.bikeNum + ' 辆';
                }
            });
        }, 2000);
    </script>
</body>
</html>
